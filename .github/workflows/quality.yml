name: Quality gate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Exposé au niveau du job pour pouvoir conditionner l'étape SonarQube Cloud.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # historique complet : nécessaire à l'analyse du nouveau code par Sonar

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les outils
        run: make install PYTHON=python

      - name: Lint et format (ruff)
        run: make lint

      - name: Typage strict (mypy, outillage puis chaque skill)
        run: make typecheck PYTHON=python

      - name: Validation des skills
        run: make validate PYTHON=python

      - name: Tests et couverture (>= 80 %)
        run: make test PYTHON=python

      - name: Quality gate (complexité, imbrication, taille, duplication)
        run: python -m tools.quality_gate tools skills --json quality-report.json

      - name: Auto-contrôle par le skill sonar-review
        run: make sonar PYTHON=python

      - name: Scripts shell (shellcheck)
        run: find skills -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Analyse SonarQube Cloud (si le secret SONAR_TOKEN est configuré)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            coverage.xml
            quality-report.json
            sonar-metrics.json
          if-no-files-found: ignore
