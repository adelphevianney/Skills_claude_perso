# Configuration SonarQube / SonarCloud.
# Renseigner sonar.organization et sonar.projectKey si le projet est importé dans SonarCloud.
sonar.projectKey=skills_claude_perso
sonar.projectName=Skills Claude perso
sonar.sourceEncoding=UTF-8

sonar.sources=tools,skills
sonar.tests=tests
sonar.test.inclusions=tests/**,skills/**/tests/**
sonar.exclusions=**/tests/**,dist/**
sonar.cpd.exclusions=**/tests/**

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
